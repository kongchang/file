<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ระบบติดตามแฟ้มเอกสาร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div id="connStatus" class="conn-status" hidden></div>

<div class="topbar">
  <div class="topbar-inner">
    <div class="topbar-left">
      <div class="brand-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 3.5H7.8C6.11984 3.5 5.27976 3.5 4.63803 3.82698C4.07354 4.1146 3.6146 4.57354 3.32698 5.13803C3 5.77976 3 6.61984 3 8.3V17.7C3 19.3802 3 20.2202 3.32698 20.862C3.6146 21.4265 4.07354 21.8854 4.63803 22.173C5.27976 22.5 6.11984 22.5 7.8 22.5H16.2C17.8802 22.5 18.7202 22.5 19.362 22.173C19.9265 21.8854 20.3854 21.4265 20.673 20.862C21 20.2202 21 19.3802 21 17.7V8.3C21 6.61984 21 5.77976 20.673 5.13803C20.3854 4.57354 19.9265 4.1146 19.362 3.82698C18.7202 3.5 17.8802 3.5 16.2 3.5H15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9 2.5C9 2.5 9 4.5 9 5C9 5.5 9.3 5.5 9.5 5.5H14.5C14.7 5.5 15 5.5 15 5C15 4.5 15 2.5 15 2.5C15 1.94772 14.5523 1.5 14 1.5H10C9.44772 1.5 9 1.94772 9 2.5Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M7.5 12H16.5M7.5 16H13.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>ระบบติดตามแฟ้มเอกสาร</h1>
      </div>
    </div>
    <div class="topbar-nav">
      <button class="nav-btn active" data-page="dashboard">Dashboard</button>
      <button class="nav-btn" data-page="add-file">+ เพิ่มแฟ้มใหม่</button>
    </div>
  </div>
</div>

<!-- ============ Dashboard Page ============ -->
<div id="dashboard-page" class="page active">
  <div class="stats-row">
    <div class="stat-card total">
      <div class="stat-num" id="statTotal">0</div>
      <div class="stat-label">แฟ้มทั้งหมด</div>
    </div>
    <div class="stat-card pending">
      <div class="stat-num" id="statPending">0</div>
      <div class="stat-label">รอรับลงมา</div>
    </div>
    <div class="stat-card done">
      <div class="stat-num" id="statDone">0</div>
      <div class="stat-label">เสร็จสิ้น</div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <div class="search-bar">
        <span class="search-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
        <input type="text" class="search-input" id="searchInput" placeholder="ค้นหาชื่อแฟ้ม, รายละเอียด หรือวันที่/เดือน/ปี..." />
        <button class="search-clear-btn" id="searchClearBtn" type="button" aria-label="ล้างคำค้นหา">✕</button>
      </div>
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">ทั้งหมด <span class="count" id="countAll">0</span></button>
        <button class="filter-tab" data-filter="pending">รอรับลงมา <span class="count" id="countPending">0</span></button>
        <button class="filter-tab" data-filter="done">เสร็จสิ้น <span class="count" id="countDone">0</span></button>
      </div>
      <div class="timeframe-row">
        <span class="timeframe-row-label">ช่วงเวลา:</span>
        <div class="timeframe-chips" id="timeframeChips">
          <button class="timeframe-chip active" data-timeframe="all">ทั้งหมด</button>
          <button class="timeframe-chip" data-timeframe="today">วันนี้</button>
          <button class="timeframe-chip" data-timeframe="week">สัปดาห์นี้</button>
          <button class="timeframe-chip" data-timeframe="month">เดือนนี้</button>
          <button class="timeframe-chip" data-timeframe="year">ปีนี้</button>
          <button class="timeframe-chip" data-timeframe="custom">กำหนดเอง</button>
        </div>
        <div class="timeframe-custom-range" id="timeframeCustomRange">
          <label class="timeframe-date-label" for="timeframeDate">เลือกวันที่</label>
          <input type="date" id="timeframeDate" class="timeframe-date-input" aria-label="เลือกวันที่" />
        </div>
      </div>
    </div>
    <div class="panel-body">
      <div class="ledger-list" id="fileList"></div>
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 7.5C3 6.11929 4.11929 5 5.5 5H9.17157C9.70201 5 10.2107 5.21071 10.5858 5.58579L12 7H18.5C19.8807 7 21 8.11929 21 9.5V17.5C21 18.8807 19.8807 20 18.5 20H5.5C4.11929 20 3 18.8807 3 17.5V7.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </div>
        <h3 class="empty-title" id="emptyTitle">ยังไม่มีแฟ้มในระบบ</h3>
        <p class="empty-text" id="emptyText">กดปุ่ม "เพิ่มแฟ้มใหม่" เพื่อเริ่มติดตามแฟ้มเอกสารของคุณ</p>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</div>

<!-- ============ Add File Page ============ -->
<div id="add-file-page" class="page">
  <div class="panel">
    <div class="panel-header" id="addFileHeader">เพิ่มแฟ้มใหม่</div>
    <div class="panel-body">
      <form id="addFileForm">
        <div class="form-group">
          <label class="form-label">ชื่อเรื่องหรือชื่อแฟ้ม</label>
          <input type="text" id="titleInput" class="form-input" placeholder="เช่น คำร้องขอ กำหนดการ ใบรับรอง ฯลฯ" maxlength="120" required>
        </div>

        <div class="form-group">
          <label class="form-label">รายละเอียดเพิ่มเติม (ไม่บังคับ)</label>
          <textarea id="descInput" class="form-textarea" placeholder="เพิ่มรายละเอียดอื่นๆ เช่น ผู้มอบ ตำแหน่ง ฯลฯ" maxlength="300"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">แนบรูป (ไม่บังคับ)</label>
          <div class="photo-upload-box" id="photoUploadBox">
            <div class="upload-icon">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 8.5C4 7.39543 4.89543 6.5 6 6.5H7.5L8.5 4.5H15.5L16.5 6.5H18C19.1046 6.5 20 7.39543 20 8.5V17.5C20 18.6046 19.1046 19.5 18 19.5H6C4.89543 19.5 4 18.6046 4 17.5V8.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.5" stroke="currentColor" stroke-width="1.6"/></svg>
            </div>
            <p class="upload-text">คลิกหรือวางรูปภาพ</p>
            <p class="upload-hint">รองรับ JPG, PNG (สูงสุด 5MB)</p>
            <input type="file" id="photoInput" accept="image/jpeg,image/png" />
          </div>
          <div class="photo-preview" id="photoPreview">
            <img class="preview-img" id="previewImg" alt="ตัวอย่างรูป" />
            <p class="preview-name" id="previewName"></p>
            <button type="button" class="remove-photo-btn" id="removePhotoBtn">ลบรูป</button>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary" id="submitBtn">บันทึกแฟ้มใหม่</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="detail-modal-backdrop" id="detailModalBackdrop">
  <div class="detail-modal">
    <button class="detail-modal-close" id="detailModalClose" aria-label="ปิด">✕</button>
    <div class="detail-modal-body" id="detailModalBody"></div>
    <div class="detail-modal-footer">
      <button class="edit-btn" id="detailEditBtn" title="แก้ไขข้อมูล" aria-label="แก้ไขข้อมูล"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M16.474 5.408a2.5 2.5 0 0 1 3.536 3.536L7.5 21.454 3 22l.546-4.5L16.474 5.408Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
      <button class="delete-btn" id="detailDeleteBtn" title="ลบ" aria-label="ลบ"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 7H20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M9 7V5C9 4.44772 9.44772 4 10 4H14C14.5523 4 15 4.44772 15 5V7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 7L6.75 19.25C6.80228 20.1074 7.51555 20.75 8.375 20.75H15.625C16.4845 20.75 17.1977 20.1074 17.25 19.25L18 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11V16.5M14 11V16.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <div class="lightbox-content">
    <button class="lightbox-close" id="lightboxClose">✕</button>
    <img class="lightbox-img" id="lightboxImg" alt="" />
  </div>
</div>

<script type="module" src="./script.js"></script>
</body>
</html>
